name: Release App & Sparkle Update

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -n 1)
          fi
          echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> $GITHUB_ENV
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          echo "Using Xcode at: ${XCODE_APP}"

      - name: Verify Swift Version
        run: swift --version

      - name: Run Unit Tests
        run: swift run --package-path Tests

      - name: Build macOS Release App
        run: |
          xcodebuild -project Clipboard.xcodeproj -scheme Clipboard \
            -configuration Release -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO

      - name: Archive Artifact
        id: archive
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          
          mkdir -p dist
          ZIP_NAME="Clipboard-${VERSION}-arm64.zip"
          cd /Users/runner/Library/Developer/Xcode/DerivedData/Clipboard-*/Build/Products/Release
          ditto -c -k --keepParent Clipboard.app "${GITHUB_WORKSPACE}/dist/${ZIP_NAME}"
          cd "${GITHUB_WORKSPACE}"

          echo "ZIP_PATH=dist/${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Sign Update with Sparkle Private Key
        id: sign
        run: |
          ZIP_PATH="${{ steps.archive.outputs.ZIP_PATH }}"
          PRIV_KEY="${{ secrets.SPARKLE_PRIVATE_KEY }}"
          
          if [ -z "$PRIV_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY secret is not set. Skipping Sparkle signature."
            echo "SIGNATURE=" >> $GITHUB_OUTPUT
            echo "LENGTH=0" >> $GITHUB_OUTPUT
          else
            OUTPUT=$(swift scripts/sign_update.swift "$ZIP_PATH" "$PRIV_KEY")
            LENGTH=$(echo "$OUTPUT" | grep "^LENGTH:" | cut -d ' ' -f2)
            SIGNATURE=$(echo "$OUTPUT" | grep "^ED_SIGNATURE:" | cut -d ' ' -f2)
            echo "SIGNATURE=${SIGNATURE}" >> $GITHUB_OUTPUT
            echo "LENGTH=${LENGTH}" >> $GITHUB_OUTPUT
          fi

      - name: Update appcast.xml
        if: steps.sign.outputs.SIGNATURE != ''
        run: |
          python3 scripts/update_appcast.py "${{ steps.archive.outputs.VERSION }}" "${{ steps.archive.outputs.ZIP_NAME }}" "${{ steps.sign.outputs.LENGTH }}" "${{ steps.sign.outputs.SIGNATURE }}" "${{ github.repository }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore(release): update appcast.xml for v${{ steps.archive.outputs.VERSION }} [skip ci]" || true
          git push origin HEAD:main || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.archive.outputs.ZIP_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
