name: Release App & Sparkle Update

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_26*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> $GITHUB_ENV
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          echo "Using Xcode at: ${XCODE_APP}"

      - name: Verify Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Run Unit Tests
        run: |
          set -o pipefail
          swift run --package-path Tests 2>&1 | tee test_run.log || {
            echo "### ❌ Unit Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test_run.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Build macOS Release App
        run: |
          set -o pipefail
          COMMIT_COUNT=$(git rev-list --count HEAD)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "Building with commit count: ${COMMIT_COUNT}, hash: ${COMMIT_HASH}"
          xcodebuild -project Clipboard.xcodeproj -scheme Clipboard \
            -configuration Release -destination 'platform=macOS' \
            CURRENT_PROJECT_VERSION="${COMMIT_COUNT}" GIT_COMMIT_HASH="${COMMIT_HASH}" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build_app.log || {
            echo "### ❌ Build macOS Release App Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 150 build_app.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Archive Artifacts (arm64, x86_64, Universal)
        id: archive
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          
          APP_DIR=$(ls -d /Users/runner/Library/Developer/Xcode/DerivedData/Clipboard-*/Build/Products/Release | tail -n 1)
          chmod +x scripts/package_release.sh
          ./scripts/package_release.sh "${VERSION}" "${APP_DIR}" "dist"

          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Sign Updates with Sparkle Private Key
        id: sign
        run: |
          VERSION="${{ steps.archive.outputs.VERSION }}"
          PRIV_KEY="${{ secrets.SPARKLE_PRIVATE_KEY }}"
          
          if [ -z "$PRIV_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY secret is not set. Skipping Sparkle signature."
            echo "ENCLOSURES_JSON=[]" >> $GITHUB_OUTPUT
          else
            ENCLOSURES="[]"

            for arch in arm64 x86_64 universal; do
              ZIP_NAME="Clipboard-${VERSION}-${arch}.zip"
              ZIP_PATH="dist/${ZIP_NAME}"
              
              if [ -f "$ZIP_PATH" ]; then
                OUTPUT=$(swift scripts/sign_update.swift "$ZIP_PATH" "$PRIV_KEY")
                LENGTH=$(echo "$OUTPUT" | grep "^LENGTH:" | cut -d ' ' -f2)
                SIGNATURE=$(echo "$OUTPUT" | grep "^ED_SIGNATURE:" | cut -d ' ' -f2)
                
                if [ "$arch" = "universal" ]; then
                  SPARKLE_ARCH=""
                else
                  SPARKLE_ARCH="$arch"
                fi
                
                ENCLOSURES=$(echo "$ENCLOSURES" | python3 -c "import sys, json; data=json.load(sys.stdin); data.append({'name': '$ZIP_NAME', 'arch': '$SPARKLE_ARCH', 'length': '$LENGTH', 'signature': '$SIGNATURE'}); print(json.dumps(data))")
              fi
            done

            echo "ENCLOSURES_JSON=${ENCLOSURES}" >> $GITHUB_OUTPUT
          fi

      - name: Update appcast.xml
        if: steps.sign.outputs.ENCLOSURES_JSON != '[]' && steps.sign.outputs.ENCLOSURES_JSON != ''
        run: |
          BUILD_VERSION=$(git rev-list --count HEAD)
          python3 scripts/update_appcast.py "${{ steps.archive.outputs.VERSION }}" "${{ github.repository }}" "${BUILD_VERSION}" '${{ steps.sign.outputs.ENCLOSURES_JSON }}'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore(release): update appcast.xml for v${{ steps.archive.outputs.VERSION }} [skip ci]" || true
          git push origin HEAD:main || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
